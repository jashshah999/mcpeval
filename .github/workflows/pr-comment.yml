name: MCP Schema Report

on:
  pull_request:
    paths:
      - "**.json"
      - "**.yaml"
      - "**.yml"

jobs:
  mcpeval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mcpeval
      - name: Run mcpeval
        run: |
          # Find schema files and generate report
          for f in $(find . -name "mcp_tools.json" -o -name "mcpeval.json" -o -name "tools.json" | head -5); do
            echo "## Checking $f" >> report.md
            mcpeval report "$f" -f markdown >> report.md
            echo "" >> report.md
          done
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('report.md')) {
              const body = fs.readFileSync('report.md', 'utf8');
              if (body.trim()) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            }
